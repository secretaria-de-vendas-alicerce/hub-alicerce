<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alicerce — Análises</title>
  <meta name="description" content="Gerenciador de Análises v3 (pastas de crédito) — Alicerce.">
  <link rel="icon" type="image/png" href="https://secretaria-de-vendas-alicerce.github.io/hub-alicerce/icones/analises/favicon-32.png">
  <link rel="apple-touch-icon" href="https://secretaria-de-vendas-alicerce.github.io/hub-alicerce/icones/analises/apple-touch-icon.png">
  <!--
    Wrapper da v3 do #13 (ORD-ANALISES-V3-001, fase R). Espelho versionado: onde ele vive de verdade é o repo
    público `secretaria-de-vendas-alicerce/hub-alicerce`, arquivo `analises-v3/index.html` (ver ../README.md
    para publicar e para conferir). O wrapper dos analistas (`analises/`, a /exec da @67) não muda.

    A /exec daqui é a da IMPLANTAÇÃO NOVA da v3 (o mesmo projeto, outro deploymentId), com `?app=v3`:
    a @68 (commit b32c0e5), criada em 07/11 (roteiro, passo 4).

    Ponte (CONTRATO-V3 §4): a tela pede o token guardado aqui (`av3-sessao-get` → `av3-sessao-value`) e manda
    guardar ou apagar (`av3-sessao-set`); o mesmo com o CÓDIGO da tela, por versão (`av3-codigo-get` com a chave →
    `av3-codigo-value`; `av3-codigo-set`: Padrão Central V2, só código, nunca dado); e, quando sai uma versão nova,
    `av3-recarregar` abre a página de novo (uma vez por minuto). Só se responde a mensagem da página do app, 2 frames
    abaixo do iframe da v3 (/exec → painel → casca), com a origem de script do Google e no formato da ponte; a
    resposta vai para essa origem, nunca '*'. Moram no localStorage DESTE endereço (github.io): o do iframe
    credentialless some ao recarregar. Qualquer página deste github.io alcança esse storage: por isso a casca
    confere o sha256 do código antes de rodar. O token não tem essa defesa (ver v3/MEDIDA-ABERTURA.md §8).

    COMO CONFERIR (nunca "o iframe carregou"):
      curl -s -L -o /dev/null -w "%{http_code}" "<a /exec>?app=v3"   # 200, nunca 404 (GET, não HEAD)
  -->
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: #fbfbfd; }
    @media (prefers-color-scheme: dark) { html, body { background: #0d1117; } }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #fallback {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center; padding: 24px;
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center;
    }
    .loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center;
      font: 14px system-ui, sans-serif; color: #8b949e; pointer-events: none;
    }
    .loading img { width: 56px; height: 56px; }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <img src="https://secretaria-de-vendas-alicerce.github.io/hub-alicerce/icones/analises/analises-hub-claro@2x.png" alt="" onerror="this.remove()">
    Carregando o Análises…
  </div>

  <iframe
    id="app"
    credentialless
    src="https://script.google.com/macros/s/AKfycbwc73XyaQAnCQ3ibUIVj_GpT_egEYK9b2IFM9P66tQAcn45bZ4uMrdjWngE1IlCkuf_/exec?app=v3"
    title="Alicerce — Análises"
    allow="clipboard-write; clipboard-read"
    referrerpolicy="no-referrer"
    onload="document.getElementById('loading').style.display='none';document.getElementById('fallback').style.display='none'"></iframe>

  <div id="fallback">
    <div>
      <p><strong>Não foi possível carregar.</strong></p>
      <p>Abra o link diretamente: <a href="https://script.google.com/macros/s/AKfycbwc73XyaQAnCQ3ibUIVj_GpT_egEYK9b2IFM9P66tQAcn45bZ4uMrdjWngE1IlCkuf_/exec?app=v3" target="_blank" rel="noopener">abrir o Análises</a>.</p>
    </div>
  </div>

  <script>
    (function () {
      var CHAVE = 'av3-sessao', CODIGO = 'av3-codigo', REABRIU = 'av3-reabriu';
      var app = document.getElementById('app');
      var TIPOS = { 'av3-sessao-get': 1, 'av3-sessao-set': 1, 'av3-codigo-get': 1, 'av3-codigo-set': 1, 'av3-recarregar': 1 };
      /* o formato: tipo conhecido; o valor, quando vem, é texto; o token é o uuid do servidor; a chave do código é curta e sem símbolo */
      function noFormato(d) {
        if (!d || typeof d !== 'object' || !TIPOS[d.tipo]) return false;
        if (d.value !== undefined && typeof d.value !== 'string') return false;
        if (d.tipo === 'av3-sessao-set' && d.value && !/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(d.value)) return false;
        return !/codigo/.test(d.tipo) || (typeof d.chave === 'string' && /^[\w.-]{1,80}$/.test(d.chave));
      }
      /* A página do app roda no host de script DESTE projeto: n-<o id dele>-0lu-script.googleusercontent.com, o mesmo em todas as
         medidas da @68 (com e sem login; _medidas/abertura-2026-11-09). Outro Apps Script tem outro id e fica de fora (Gerente, 11/11).
         O número antes do "lu" fica aberto: não está medido se ele muda (com mais de uma conta Google no navegador, por exemplo), e
         fixo ele derrubaria calado a sessão de quem caísse noutro; o id é o que separa este projeto dos outros.
         Projeto novo = host novo: a tela pede a senha e baixa o código (falha segura) até este id ser trocado aqui */
      function doGoogle(origem) {
        return /^https:\/\/n-xu2d7tddbeud45lgicojf5qfymg5fhtazmluk2i-\d+lu-script\.googleusercontent\.com$/.test(origem);
      }
      /* e mora 2 frames abaixo do iframe: /exec -> painel -> página (medido na @68). Se o Google mudar isso, a tela pede a senha e baixa o código: falha segura */
      function doIframe(w) {
        var p = w && w.parent;
        return !!p && p.parent === app.contentWindow;
      }
      window.addEventListener('message', function (ev) {
        if (!doIframe(ev.source) || !doGoogle(ev.origin) || !noFormato(ev.data)) return;
        var d = ev.data;
        function responder(tipo, valor) { ev.source.postMessage({ tipo: tipo, value: valor }, ev.origin); }
        try {
          if (d.tipo === 'av3-sessao-get') responder('av3-sessao-value', localStorage.getItem(CHAVE) || '');
          else if (d.tipo === 'av3-sessao-set') {
            if (typeof d.value === 'string' && d.value) localStorage.setItem(CHAVE, d.value); else localStorage.removeItem(CHAVE);
          } else if (d.tipo === 'av3-codigo-get') {
            var g = JSON.parse(localStorage.getItem(CODIGO) || 'null');
            responder('av3-codigo-value', g && g.chave === d.chave ? g.value : '');
          } else if (d.tipo === 'av3-codigo-set') {
            if (typeof d.value === 'string' && d.value) localStorage.setItem(CODIGO, JSON.stringify({ chave: d.chave, value: d.value })); else localStorage.removeItem(CODIGO);
          } else if (d.tipo === 'av3-recarregar') {
            /* saiu uma versão nova: abre de novo daqui (dentro do frame do Apps Script, reload deixa a página em branco). No máximo uma
               vez por minuto: a /exec que ainda serve a casca velha não vira laço, e a tela diz "Feche e abra de novo" */
            if (Date.now() - Number(sessionStorage.getItem(REABRIU) || 0) > 60000) { sessionStorage.setItem(REABRIU, String(Date.now())); location.reload(); }
          }
        } catch (e) {
          /* sem armazenamento (aba anônima, bloqueio) ou cheio: a tela pede a senha e baixa o código */
          if (d.tipo === 'av3-sessao-get') responder('av3-sessao-value', '');
          if (d.tipo === 'av3-codigo-get') responder('av3-codigo-value', '');
        }
      });
      setTimeout(function () {
        var ld = document.getElementById('loading');
        if (ld && ld.style.display !== 'none') {
          ld.style.display = 'none';
          document.getElementById('fallback').style.display = 'flex';
        }
      }, 12000);
    })();
  </script>
</body>
</html>
