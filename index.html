<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alicerce — Hub</title>
  <meta name="description" content="Portal de sistemas, setores e ferramentas da Alicerce.">
  <!--
    WRAPPER ANTI /u/N/ — por que este arquivo existe
    -------------------------------------------------
    O web app do Apps Script e servido em script.google.com/macros/s/.../exec.
    Com 2+ contas Google logadas, o Google redireciona a /exec para /u/1/, /u/2/...
    e mostra "Nao foi possivel abrir o arquivo". Carregando a MESMA /exec dentro de
    um <iframe credentialless> a partir de um dominio que NAO e google.com, o app
    abre igual em qualquer navegador Chromium. Ver o wrapper do #9 e do #11.

    Pre-requisitos (feitos no app #14):
      - Implantacao: "Executar como: Eu" + "Quem pode acessar: Qualquer pessoa".
      - doGet(): setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL).

    O src abaixo e a /exec de PRODUCAO do hub. O deploymentId nunca muda (o
    redeploy e sempre no MESMO id, por isso o endereco da equipe e estavel).
    Qual versao esta servida e qual e o rollback: HANDOFF.md do app #14 — aqui a
    frase envelhecia sozinha (dizia "@5 = v0.2.0" um mes depois).

    NOTAS (R-01): o localStorage do iframe credentialless e efemero. Este wrapper
    (origem estavel github.io) guarda as notas e responde ao hub por postMessage.
  -->
  <style>
    /*
      SAFE AREA (ORD-HUB-MOBILE-001 §4) — por que estas 3 regras existem
      -----------------------------------------------------------------
      Dentro de um iframe, env(safe-area-inset-*) vale ZERO. O hub, para a equipe,
      roda SEMPRE dentro deste iframe, e a barra inferior dele usa esse valor: sem
      tratar aqui, no iPhone e nos Android com barra de gestos a barra do hub fica
      parcialmente coberta — o rodape do portal, inacessivel. Quem tem a informacao
      e esta pagina.

      A altura do #app e CALCULADA, e nao inset/bottom: <iframe> e elemento
      SUBSTITUIDO, entao com height:auto o navegador usa a altura intrinseca dele
      (150 px!) e descarta o bottom — o hub inteiro vira uma faixa de 150 px. Foi o
      que aconteceu ao seguir a receita a risca; quem pegou foi o ponte-wrapper.js.

      A faixa que sobra fica com a cor da barra do hub (= --surface). Este wrapper
      NAO sabe o tema escolhido dentro do hub — a ponte postMessage so carrega notas
      e fixados —, entao seguimos o tema do APARELHO. Se a pessoa forcar no hub o
      tema contrario ao do sistema, a faixa de ~34 px destoa; decisao do Diretor em
      19/09, e o conserto seria estender a ponte com {tipo:'tema'}.
    */
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: #fafafa; }  /* = --surface claro do hub */
    #app { position: fixed; inset: 0; width: 100%; height: calc(100% - env(safe-area-inset-bottom)); border: 0; display: block; }
    #fallback {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center; padding: 24px;
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #27272a; text-align: center;
    }
    #fallback a { color: #2563eb; }
    .loading {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      font: 14px system-ui, sans-serif; color: #6c6c75; pointer-events: none;
    }
    /* o fundo claro tornaria o texto do fallback invisivel no escuro, e vice-versa */
    @media (prefers-color-scheme: dark) {
      html, body { background: #18181b; }                         /* = --surface escuro do hub */
      #fallback { color: #c9d1d9; }
      #fallback a { color: #58a6ff; }
      .loading { color: #8b949e; }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Carregando o hub…</div>

  <!--
    credentialless: carrega o iframe num contexto efemero, SEM os cookies de sessao
    do Google (igual a uma aba anonima) — e o que contorna o roteador /u/N/.
    Chromium (Chrome/Edge 110+). Firefox/Safari ignoram (fallback: link direto).
  -->
  <iframe
    id="app"
    credentialless
    src="https://script.google.com/macros/s/AKfycbwp4plsaMBd71fl_tnb_Heh3eaDe2VtKdS7Dj9jTzxY016M82Ry-OdGEqxxK2ViloQ6/exec"
    title="Alicerce — Hub"
    allow="clipboard-write; clipboard-read"
    referrerpolicy="no-referrer"
    onload="document.getElementById('loading').style.display='none'"></iframe>

  <div id="fallback">
    <div>
      <p><strong>Nao foi possivel carregar.</strong></p>
      <p>Abra o link diretamente:
        <a id="directLink" href="https://script.google.com/macros/s/AKfycbwp4plsaMBd71fl_tnb_Heh3eaDe2VtKdS7Dj9jTzxY016M82Ry-OdGEqxxK2ViloQ6/exec" target="_blank" rel="noopener">abrir o hub</a>.
      </p>
    </div>
  </div>

  <script>
    // Fallback: se o iframe nao sinalizar load em ~12s, oferece o link direto.
    setTimeout(function () {
      var ld = document.getElementById('loading');
      if (ld && ld.style.display !== 'none') {
        ld.style.display = 'none';
        document.getElementById('fallback').style.display = 'flex';
      }
    }, 12000);

    // Ponte de estado (R-01): o localStorage do iframe credentialless e EFEMERO,
    // entao quem guarda e este wrapper (origem estavel github.io). O hub pede e
    // salva por postMessage; aqui e o unico lugar onde o valor dura.
    //
    // Duas chaves, mesmo protocolo:
    //   notas   -> hub-notas-get / hub-notas-value / hub-notas-set  (v0.1.0)
    //   fixados -> hub-fix-get   / hub-fix-value   / hub-fix-set    (v0.2.0)
    // Os nomes das mensagens de notas NAO mudaram de proposito: um hub v0.1.0
    // servido por este wrapper continua funcionando igual. E um hub v0.2.0 num
    // wrapper velho tambem nao quebra — ele so nao recebe resposta de 'hub-fix-get'
    // e fica com a faixa "Nada fixado ainda".
    var CHAVES = { 'hub-notas': 'alicerce-notas', 'hub-fix': 'hub-fixados' };

    // Quem fala com a gente NAO e o filho direto do iframe. O Apps Script aninha
    // mais dois frames no meio:
    //   este wrapper > /macros/s/.../exec > /userCodeAppPanel > /blank (o app)
    // A guarda daqui era `ev.source === iframe.contentWindow`, e do outro lado o
    // hub postava em `window.parent` — os dois errados pelo mesmo motivo. Por isso
    // a ponte das NOTAS nunca funcionou no ar desde julho: o wrapper nao recebia
    // mensagem nenhuma, e o fallback local do hub cobria o caso comum em silencio.
    // Medido na arvore de frames de producao em 07/09.
    //
    // A guarda que vale e a ORIGEM: so o host que serve o app do Apps Script.
    function origemConfiavel(o) {
      return o === 'https://script.google.com'
        || /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(o);
    }
    window.addEventListener('message', function (ev) {
      if (!origemConfiavel(ev.origin)) return;
      var d = ev.data;
      if (!d || typeof d.tipo !== 'string') return;
      var corte = d.tipo.lastIndexOf('-');
      var prefixo = d.tipo.slice(0, corte);
      var chave = CHAVES[prefixo];
      if (!chave) return;
      var acao = d.tipo.slice(corte + 1);
      if (acao === 'get') {
        var v = '';
        try { v = localStorage.getItem(chave) || ''; } catch (e) {}
        ev.source.postMessage({ tipo: prefixo + '-value', value: v }, '*');
      } else if (acao === 'set') {
        try { localStorage.setItem(chave, String(d.value || '')); } catch (e) {}
      }
    });
  </script>
</body>
</html>
